[workspace]
members = ["crates/abi", "crates/sdk"]
resolver = "3"

[package]
name = "block_game"
version = "0.0.0"
edition = "2024"

[dependencies]
wgpu = "30.0.1"
winit = { version = "0.30.12", features = ["serde"] }
crossbeam-channel = "0.5.17"
bytemuck = "1.25.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
glyph_brush = "0.7.12"
rayon = "1.12.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
pollster = "1.0.1"
glam = { version = "0.34.0", features = ["bytemuck", "rand-010", "serde"] }
num-traits = "0.2.19"
arc-swap = "1.9.2"
rand = "0.10.3"
rand_seeder = "0.5.0"
rand_pcg = "0.10.2"
anyhow = "1.0.104"
smallvec = { version = "1.16.2", features = ["serde"] }
bimap = "0.6.3"
variadic = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
postcard = { version = "1.1.3", features = ["use-std"] }
log = "0.4.34"
env_logger = "0.11.11"
wasmtime = { version = "47.0.4", default-features = false, features = ["cranelift", "runtime", "std"] }
block-game-abi = { path = "crates/abi" }
